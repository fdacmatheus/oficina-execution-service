apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-execution-config
  namespace: oficina
data:
  NODE_ENV: 'production'
  PORT: '3003'
  LOG_FORMAT: 'json'
  AWS_REGION: 'us-east-1'
  DYNAMODB_TABLE: 'oficina-execucoes'
  # As URLs reais das filas (com o ID da conta) sao gravadas pelo pipeline a
  # partir dos outputs do Terraform; os valores abaixo sao so o formato.
  SQS_EXECUTION_COMANDOS_URL: 'https://sqs.us-east-1.amazonaws.com/000000000000/execution-comandos'
  SQS_OS_EVENTOS_URL: 'https://sqs.us-east-1.amazonaws.com/000000000000/os-eventos'
  SQS_CONSUMER_ENABLED: 'true'
  OUTBOX_PUBLISHER_ENABLED: 'true'
  OUTBOX_INTERVAL_MS: '1000'
